<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ExpenseIQ — Sign in to your personal finance tracker. Manage income, expenses, budgets, and visualize your spending.">
  <title>Sign In — ExpenseIQ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="sidebar-logo">E</div>
        <h1>ExpenseIQ</h1>
        <p>Track your finances intelligently</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <div id="loginError" class="form-error" style="margin-bottom:16px;display:none"></div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;padding:14px;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
